[project]
name = "dyvider"
version = "0.3"
description = "Rapid and exact partitioning algorithms for graphs embedded in one dimension."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jean-Gabriel Young", email = "jean-gabriel.young@uvm.edu" },
    { name = "Alice Patania" },
]
keywords = ["graphs", "community detection", "networks", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
tutorial = [
    "jupyterlab>=4.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/jg-you/dyvider"
Issues = "https://github.com/jg-you/dyvider/issues"
Paper = "https://arxiv.org/abs/2301.10403"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dyvider"]

[tool.hatch.build.targets.sdist]
include = [
    "/dyvider",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/repo_img.png",
    "/tutorial.ipynb",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
